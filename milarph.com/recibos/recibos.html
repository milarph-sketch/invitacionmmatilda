<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>MILAR — Generador de recibos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bordo:#8B3A52;
    --bordo-oscuro:#5E2539;
    --crema:#FBF4EC;
    --rosa-palida:#F4E1E6;
    --negro-calido:#262223;
    --borde:#E7D7DC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--crema);
    color:var(--negro-calido);
    font-family:'Josefin Sans', sans-serif;
    font-weight:300;
    padding-bottom:110px;
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:1px solid var(--borde);
    background:var(--crema);
    position:sticky;
    top:0;
    z-index:5;
  }
  header h1{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    color:var(--bordo);
    font-size:34px;
    margin:0 0 2px;
    letter-spacing:0.5px;
  }
  header p{
    margin:0;
    font-size:12px;
    letter-spacing:3px;
    text-transform:lowercase;
    color:var(--bordo);
    opacity:0.75;
  }
  header .subtitulo{
    margin-top:10px;
    font-size:14px;
    letter-spacing:0.3px;
    color:var(--negro-calido);
    opacity:0.7;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:18px 16px 40px;
  }
  fieldset{
    border:1px solid var(--borde);
    border-radius:14px;
    background:#fff;
    padding:18px 16px 20px;
    margin:0 0 16px;
  }
  legend{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-style:italic;
    color:var(--bordo);
    font-size:20px;
    padding:0 8px;
  }
  .campo{margin-bottom:14px;}
  .campo:last-child{margin-bottom:0;}
  label{
    display:block;
    font-size:13px;
    color:var(--negro-calido);
    opacity:0.85;
    margin-bottom:5px;
    letter-spacing:0.2px;
  }
  .hint{
    font-size:11.5px;
    color:var(--bordo);
    opacity:0.75;
    margin-top:4px;
  }
  input[type=text], input[type=number], input[type=date], select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--borde);
    border-radius:9px;
    font-size:15px;
    font-family:'Josefin Sans', sans-serif;
    background:#fff;
    color:var(--negro-calido);
  }
  input:focus, select:focus{
    outline:2px solid var(--bordo);
    outline-offset:1px;
  }
  textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--borde);
    border-radius:9px;
    font-size:15px;
    font-family:'Josefin Sans', sans-serif;
    background:#fff;
    color:var(--negro-calido);
    resize:vertical;
    min-height:44px;
  }
  .fila2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
  }
  .chip{
    border:1px solid var(--bordo);
    color:var(--bordo);
    background:var(--rosa-palida);
    font-family:'Josefin Sans', sans-serif;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .chip:active{background:var(--bordo); color:#fff;}
  .resumen{
    background:var(--rosa-palida);
    border:1px solid var(--borde);
    border-radius:10px;
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--bordo-oscuro);
  }
  .barra-inferior{
    position:fixed;
    bottom:0; left:0; right:0;
    background:#fff;
    border-top:1px solid var(--borde);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    justify-content:center;
    z-index:10;
  }
  .btn-generar{
    width:100%;
    max-width:640px;
    background:var(--bordo);
    color:#fff;
    border:none;
    padding:15px;
    border-radius:11px;
    font-size:16px;
    font-family:'Josefin Sans', sans-serif;
    font-weight:500;
    letter-spacing:0.4px;
    cursor:pointer;
  }
  .btn-generar:active{background:var(--bordo-oscuro);}
  .error-msg{
    color:#A6304A;
    font-size:13px;
    margin:0 0 14px;
    padding:10px 12px;
    background:#FBE7EC;
    border-radius:8px;
    display:none;
  }
</style>
</head>
<body>

<header>
  <h1>MILAR</h1>
  <p>f o t o g r a f í a</p>
  <div class="subtitulo">Generador de recibos</div>
</header>

<main>
  <div class="error-msg" id="errorMsg"></div>
  <form id="recForm">

    <fieldset>
      <legend>Recibo</legend>
      <div class="fila2">
        <div class="campo">
          <label for="numeroRecibo">N° de recibo</label>
          <input type="text" id="numeroRecibo" placeholder="Ej: 0012">
        </div>
        <div class="campo">
          <label for="fechaRecibo">Fecha</label>
          <input type="date" id="fechaRecibo">
        </div>
      </div>
      <div class="campo">
        <label for="clienteNombre">Recibí de (cliente)</label>
        <input type="text" id="clienteNombre" placeholder="Ej: Romina">
      </div>
      <div class="campo">
        <label for="monto">La suma de ($)</label>
        <input type="number" id="monto" placeholder="Ej: 250000" min="0" step="1000">
      </div>
      <div class="campo">
        <label for="concepto">En concepto de</label>
        <textarea id="concepto" placeholder="Ej: Seña — Contrato fotográfico 15 años"></textarea>
        <div class="chips">
          <span class="chip" data-val="Seña — Contrato fotográfico">Seña</span>
          <span class="chip" data-val="Cuota 1 de 3 — Contrato fotográfico">Cuota 1 de 3</span>
          <span class="chip" data-val="Cuota 2 de 3 — Contrato fotográfico">Cuota 2 de 3</span>
          <span class="chip" data-val="Cuota 3 de 3 — Contrato fotográfico">Cuota 3 de 3</span>
          <span class="chip" data-val="Pago total — Contrato fotográfico">Pago total</span>
        </div>
      </div>
      <div class="campo">
        <label for="formaPago">Forma de pago</label>
        <select id="formaPago">
          <option>Transferencia bancaria</option>
          <option>Efectivo</option>
          <option>Otro</option>
        </select>
      </div>
      <div class="campo">
        <label for="saldoPendiente">Saldo pendiente ($, opcional)</label>
        <input type="number" id="saldoPendiente" placeholder="Dejar vacío si quedó saldado" min="0" step="1000">
      </div>
      <div class="resumen" id="resumenRecibo"></div>
    </fieldset>

  </form>
</main>

<div class="barra-inferior">
  <button class="btn-generar" id="generateBtn" type="button">Generar recibo (PDF)</button>
</div>

<script src="jspdf.umd.min.js"></script>
<script src="fonts-embed.js"></script>
<script src="app.js"></script>
</body>
</html>
